<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1030" viewBox="0 0 840 1030" role="img" aria-labelledby="title desc">
<title id="title">简历评估智能体：从原文证据到人工校准</title><desc id="desc">人工确认岗位标准，AI提取原文证据并按版本规则或判例形成建议，证据不足交还人工，再对照真实结果进行校准。流程为说明示意，不代表所有版本已经自动闭环。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#59718a" stroke-width="1.5"/></marker></defs>
<rect width="840" height="1030" rx="24" fill="#f4f7fb"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3046">
<text x="40" y="53" font-size="28" font-weight="600">让 AI 建议有依据，也能被纠正</text><text x="40" y="82" font-size="15" fill="#5b6d80">简历评估智能体 · 公开展示流程示意</text>
<g fill="none" stroke="#59718a" stroke-width="2" marker-end="url(#arrow)">
<path d="M215 220V245H420V270"/><path d="M605 220V245H420"/><path d="M420 365V405"/><path d="M420 500V525H215V555"/><path d="M420 525H605V555"/><path d="M215 650V680H420V715"/><path d="M605 650V680H420"/><path d="M420 810V850"/>
</g>
<rect x="40" y="120" width="350" height="100" rx="14" fill="#fff0d8" stroke="#d6b47d"/><text x="64" y="155" font-size="14" fill="#88652e">人工确定</text><text x="64" y="186" font-size="21" font-weight="600">岗位要求与判断标准</text>
<rect x="430" y="120" width="350" height="100" rx="14" fill="#fff0d8" stroke="#d6b47d"/><text x="454" y="155" font-size="14" fill="#88652e">适用版本使用</text><text x="454" y="186" font-size="21" font-weight="600">已标注的历史案例</text>
<rect x="160" y="270" width="520" height="95" rx="14" fill="#dae9fa" stroke="#9ab9dc"/><text x="184" y="304" font-size="14" fill="#42668d">AI 整理</text><text x="184" y="336" font-size="21" font-weight="600">结构化简历，并保留对应原文</text>
<rect x="160" y="405" width="520" height="95" rx="14" fill="#dae9fa" stroke="#9ab9dc"/><text x="184" y="440" font-size="14" fill="#42668d">AI 评估 · 各版本方法分别说明</text><text x="184" y="471" font-size="21" font-weight="600">按当前规则或相似判例形成建议</text>
<rect x="40" y="555" width="350" height="95" rx="14" fill="#fff" stroke="#b9c7d6"/><text x="64" y="590" font-size="14" fill="#65778a">证据不足或存在冲突</text><text x="64" y="622" font-size="21" font-weight="600">列出缺口，交给人工</text>
<rect x="430" y="555" width="350" height="95" rx="14" fill="#fff" stroke="#b9c7d6"/><text x="454" y="590" font-size="14" fill="#65778a">足以形成建议</text><text x="454" y="622" font-size="21" font-weight="600">展示结论、依据与限制</text>
<rect x="160" y="715" width="520" height="95" rx="14" fill="#fff0d8" stroke="#d6b47d"/><text x="184" y="750" font-size="14" fill="#88652e">人工判断</text><text x="184" y="781" font-size="21" font-weight="600">复核、补证与后续评估</text>
<rect x="160" y="850" width="520" height="95" rx="14" fill="#e0eee7" stroke="#a3c1b1"/><text x="184" y="885" font-size="14" fill="#4a7260">校准实验</text><text x="184" y="916" font-size="21" font-weight="600">对照真实结果，检查分歧与误判</text>
<path d="M680 899H808V170H780" fill="none" stroke="#6b8c7c" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="40" y="986" font-size="14" fill="#65778a">虚线：经验证后的迭代。具体自动化范围、样本与结果须按版本标注。</text>
</g></svg>