name: Offline core checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -v
      - run: python -m py_compile maimai_hr.py
      - run: node --check card_compare.js
      - run: node --input-type=module --check < browser_worker.js
